services:
    postgres:
        image: postgres:17-alpine
        container_name: qualif-id-postgres
        restart: always
        environment:
            - POSTGRES_USER=$DB_USERNAME
            - POSTGRES_PASSWORD=$DB_PASSWORD
        ports:
            - 5432:5432
        expose:
            - 5432
        volumes:
            - ./volume/postgresql/:/var/lib/postgresql/data
